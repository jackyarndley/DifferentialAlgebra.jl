name: Run tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            julia-version: '1.12'
            experimental: false
          - os: ubuntu-latest
            julia-version: '1'
            experimental: false
          - os: windows-latest
            julia-version: '1'
            experimental: false
          - os: macos-latest
            julia-version: '1'
            experimental: false
          - os: ubuntu-latest
            julia-version: pre
            experimental: true

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-runtest@v1
        with:
          check_bounds: 'yes'
          coverage: 'false'
        env:
          JULIA_NUM_THREADS: '4'

  format:
    name: Runic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: fredrikekre/runic-action@v1
        with:
          version: '1.11.1'
          docstrings: 'true'

  forwarddiff-010:
    name: ForwardDiff 0.10 / Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.12', '1']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Test standalone ForwardDiff integration
        shell: julia --color=yes --startup-file=no --check-bounds=yes {0}
        env:
          JULIA_NUM_THREADS: '4'
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          using Pkg
          checkout = pwd()
          Pkg.activate(mktempdir())
          Pkg.develop(path = checkout)
          Pkg.add([
              PackageSpec(name = "ForwardDiff", version = "0.10.36"),
              PackageSpec(name = "LinearAlgebra"), PackageSpec(name = "Test"),
              PackageSpec(name = "SafeTestsets"),
          ])
          using SafeTestsets: @safetestset
          @safetestset "Public API" begin
              include(joinpath(pwd(), "test", "public_api.jl"))
          end
          @safetestset "Time series" begin
              include(joinpath(pwd(), "test", "time_series.jl"))
          end
          @safetestset "Mixed ForwardDiff arithmetic" begin
              include(joinpath(pwd(), "test", "forwarddiff.jl"))
          end
          @safetestset "ForwardDiff ADS" begin
              include(joinpath(pwd(), "test", "forwarddiff_ads.jl"))
          end
