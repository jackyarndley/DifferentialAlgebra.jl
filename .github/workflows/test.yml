name: Run tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia 1 / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Prepare test dependencies with normal compilation
        shell: julia --startup-file=no --project=test --check-bounds=yes -O0 {0}
        run: |
          using Pkg
          Pkg.instantiate()
          Pkg.precompile()
      - name: Run numerical and integration tests
        shell: julia --startup-file=no --project=test --check-bounds=yes --compile=min -O0 {0}
        run: |
          @time include(joinpath(pwd(), "test", "runtests.jl"))
        env:
          JULIA_NUM_THREADS: '4'

      - name: Check package and extension hygiene
        shell: julia --startup-file=no --project=test --check-bounds=yes --compile=min -O0 {0}
        run: |
          include(joinpath(pwd(), "test", "quality.jl"))
      - name: Check formatting
        uses: fredrikekre/runic-action@v1
        with:
          version: '1.11.1'
          docstrings: 'true'
