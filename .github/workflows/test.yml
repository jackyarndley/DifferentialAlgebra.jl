name: Run tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia latest / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Prepare test dependencies with normal compilation
        shell: julia --startup-file=no --project=test --check-bounds=yes -O0 {0}
        run: |
          using Pkg
          Pkg.instantiate()
          Pkg.precompile()
      - name: Run numerical and integration tests
        shell: julia --startup-file=no --project=test --check-bounds=yes --compile=min -O0 {0}
        run: |
          @time include(joinpath(pwd(), "test", "runtests.jl"))
        env:
          JULIA_NUM_THREADS: '4'

  quality:
    name: Aqua / Julia latest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Check package and extension hygiene
        shell: julia --startup-file=no --project=test {0}
        run: |
          using Pkg
          Pkg.instantiate()
          include(joinpath(pwd(), "test", "quality.jl"))

  format:
    name: Runic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: fredrikekre/runic-action@v1
        with:
          version: '1.11.1'
          docstrings: 'true'

  forwarddiff-010:
    name: ForwardDiff 0.10 / Julia latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Test standalone ForwardDiff integration
        shell: julia --color=yes --startup-file=no --check-bounds=yes {0}
        env:
          JULIA_NUM_THREADS: '4'
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          using Pkg
          checkout = pwd()
          Pkg.activate(mktempdir())
          Pkg.develop(path = checkout)
          Pkg.add([
              PackageSpec(name = "ForwardDiff", version = "0.10.36"),
              PackageSpec(name = "LinearAlgebra"), PackageSpec(name = "Test"),
              PackageSpec(name = "SafeTestsets"),
          ])
          Pkg.add(PackageSpec(name = "GenericLinearAlgebra"))
          using SafeTestsets: @safetestset
          include(joinpath(pwd(), "test", "support", "fixtures.jl"))
          @safetestset "ForwardDiff integration" begin
              include(joinpath(pwd(), "test", "interop.jl"))
          end
