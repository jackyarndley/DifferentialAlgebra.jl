name: Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Build documentation and run examples
        shell: julia --color=yes --project=docs {0}
        run: |
          using Pkg
          Pkg.develop(path=".")
          Pkg.instantiate()
          include(joinpath(pwd(), "docs", "make.jl"))
      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs/build
          if-no-files-found: error
